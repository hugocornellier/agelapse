display_name: "AgeLapse"
package_name: "agelapse"
version: "2.7.0"
architecture: "amd64"

section: "utils"
priority: "optional"
maintainer:
  name: "Hugo Cornellier"
  email: "agelapse@gmail.com"
homepage: "https://github.com/hugocornellier/agelapse"
description: "AgeLapse - create stabilized aging timelapses."

installed_size: 223124

install_path: "/opt/agelapse"
icon: "linux/packaging/deb/agelapse.png"

dependencies:
  - ffmpeg
  - libgtk-3-0 | libgtk-3-0t64
  - libgstreamer1.0-0
  - libgstreamer-plugins-base1.0-0
  - libmpv2 | libmpv1
  - libturbojpeg | libturbojpeg0
  # The Flutter Linux embedder dlopens libGLESv2.so.2 and libEGL.so.1 at
  # startup and aborts if either is missing. Because they are dlopened rather
  # than linked, they never appear in ldd output, so only launching the app
  # catches their absence. They arrive transitively on developer machines via
  # the -dev packages, which is why this went unnoticed.
  - libgles2 | libgles2-mesa
  - libegl1 | libegl1-mesa

generic_name: "Timelapse Creator"
categories:
  - "Video"
  - "Utility"
keywords:
  - "timelapse"
  - "video"
  - "aging"
startup_notify: true
startup_wm_class: "com.hugocornellier.agelapse"
