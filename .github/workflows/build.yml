name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format-and-analyze:
    name: Format & Analyze (${{ matrix.flutter-channel }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: ${{ matrix.flutter-channel == 'beta' }}
    strategy:
      fail-fast: false
      matrix:
        flutter-channel: [stable, beta]
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ matrix.flutter-channel }}
          flutter-version: ${{ matrix.flutter-channel == 'stable' && '3.44.8' || '' }}
          cache: ${{ matrix.flutter-channel == 'stable' }}
          pub-cache: false
          cache-key: 'flutter-:os:-:channel:-:version:-:arch:-:hash:'

      - name: Install dependencies
        # Beta pins framework packages independently of stable. Preserve the
        # committed lock exactly on stable; let beta resolve only SDK deltas.
        run: flutter pub get ${{ matrix.flutter-channel == 'stable' && '--enforce-lockfile' || '' }}

      - name: Verify formatting
        run: bash tool/check_format.sh

      - name: Analyze
        run: flutter analyze --fatal-infos .

  build-android:
    name: Build Android (${{ matrix.flutter-channel }})
    runs-on: ubuntu-latest
    timeout-minutes: 75
    continue-on-error: ${{ matrix.flutter-channel == 'beta' }}
    strategy:
      fail-fast: false
      matrix:
        flutter-channel: [stable, beta]
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ matrix.flutter-channel }}
          flutter-version: ${{ matrix.flutter-channel == 'stable' && '3.44.8' || '' }}
          cache: ${{ matrix.flutter-channel == 'stable' }}
          pub-cache: false
          cache-key: 'flutter-:os:-:channel:-:version:-:arch:-:hash:'

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Install dependencies
        run: flutter pub get ${{ matrix.flutter-channel == 'stable' && '--enforce-lockfile' || '' }}

      - name: Prefetch native artifacts
        uses: ./.github/actions/prefetch-native-artifacts
        with:
          target: android

      - name: Build APK (debug)
        run: flutter build apk --debug

      - name: Create CI release keystore
        if: matrix.flutter-channel == 'stable'
        run: |
          keytool -genkeypair -noprompt \
            -keystore "$RUNNER_TEMP/agelapse-ci-release.jks" \
            -storepass ci-only-password \
            -keypass ci-only-password \
            -alias agelapse-ci \
            -keyalg RSA \
            -keysize 2048 \
            -validity 1 \
            -dname "CN=AgeLapse CI, OU=CI, O=AgeLapse, L=Halifax, ST=Nova Scotia, C=CA"
          printf '%s\n' \
            "storeFile=$RUNNER_TEMP/agelapse-ci-release.jks" \
            "storePassword=ci-only-password" \
            "keyAlias=agelapse-ci" \
            "keyPassword=ci-only-password" \
            > android/key.properties

      - name: Build APK (release)
        if: matrix.flutter-channel == 'stable'
        run: flutter build apk --release

  build-ios:
    name: Build iOS (${{ matrix.flutter-channel }})
    runs-on: macos-15
    timeout-minutes: 90
    continue-on-error: ${{ matrix.flutter-channel == 'beta' }}
    strategy:
      fail-fast: false
      matrix:
        flutter-channel: [stable, beta]
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode 26.3
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ matrix.flutter-channel }}
          flutter-version: ${{ matrix.flutter-channel == 'stable' && '3.44.8' || '' }}
          cache: ${{ matrix.flutter-channel == 'stable' }}
          pub-cache: false
          cache-key: 'flutter-:os:-:channel:-:version:-:arch:-:hash:'

      - name: Cache CocoaPods
        uses: actions/cache@v5
        with:
          path: ios/Pods
          key: pods-ios-${{ hashFiles('ios/Podfile.lock', 'pubspec.lock') }}
          restore-keys: pods-ios-

      - name: Install dependencies
        run: flutter pub get ${{ matrix.flutter-channel == 'stable' && '--enforce-lockfile' || '' }}

      - name: Prefetch native artifacts
        uses: ./.github/actions/prefetch-native-artifacts
        with:
          target: ios

      - name: Install iOS pods
        working-directory: ios
        run: |
          for attempt in 1 2 3; do
            pod install --repo-update && break
            echo "pod install attempt $attempt failed, retrying in $((attempt * 15))s..."
            [ "$attempt" -eq 3 ] && exit 1
            sleep $((attempt * 15))
          done

      - name: Build iOS (no codesign)
        run: |
          for attempt in 1 2 3; do
            flutter build ios --debug --no-codesign && exit 0
            echo "flutter build ios attempt $attempt failed, retrying in $((attempt * 30))s..."
            [ "$attempt" -eq 3 ] && exit 1
            sleep $((attempt * 30))
          done

      - name: Build iOS release (no codesign)
        if: matrix.flutter-channel == 'stable'
        run: flutter build ios --release --no-codesign

  build-macos:
    name: Build macOS (${{ matrix.flutter-channel }})
    runs-on: macos-15
    timeout-minutes: 90
    continue-on-error: ${{ matrix.flutter-channel == 'beta' }}
    strategy:
      fail-fast: false
      matrix:
        flutter-channel: [stable, beta]
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ matrix.flutter-channel }}
          flutter-version: ${{ matrix.flutter-channel == 'stable' && '3.44.8' || '' }}
          cache: ${{ matrix.flutter-channel == 'stable' }}
          pub-cache: false
          cache-key: 'flutter-:os:-:channel:-:version:-:arch:-:hash:'

      - name: Cache CocoaPods
        uses: actions/cache@v5
        with:
          path: macos/Pods
          key: pods-macos-${{ hashFiles('macos/Podfile.lock', 'pubspec.lock') }}
          restore-keys: pods-macos-

      - name: Install dependencies
        run: flutter pub get ${{ matrix.flutter-channel == 'stable' && '--enforce-lockfile' || '' }}

      - name: Prefetch native artifacts
        uses: ./.github/actions/prefetch-native-artifacts
        with:
          target: macos

      - name: Install macOS pods
        working-directory: macos
        run: |
          for attempt in 1 2 3; do
            pod install --repo-update && break
            echo "pod install attempt $attempt failed, retrying in $((attempt * 15))s..."
            [ "$attempt" -eq 3 ] && exit 1
            sleep $((attempt * 15))
          done

      - name: Build macOS (debug)
        run: flutter build macos --debug

      - name: Build macOS (release)
        if: matrix.flutter-channel == 'stable'
        env:
          # Flutter forwards FLUTTER_XCODE_* variables as command-line Xcode
          # settings, so CI can exercise Release without a developer identity.
          FLUTTER_XCODE_CODE_SIGNING_ALLOWED: 'NO'
          FLUTTER_XCODE_CODE_SIGNING_REQUIRED: 'NO'
          FLUTTER_XCODE_CODE_SIGNING_IDENTITY: ''
        run: flutter build macos --release

      - name: Audit macOS release dependencies
        if: matrix.flutter-channel == 'stable'
        run: bash tool/check_macos_bundle_dependencies.sh build/macos/Build/Products/Release/AgeLapse.app

  build-linux:
    name: Build Linux (${{ matrix.flutter-channel }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    continue-on-error: ${{ matrix.flutter-channel == 'beta' }}
    strategy:
      fail-fast: false
      matrix:
        flutter-channel: [stable, beta]
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build libgtk-3-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libmpv-dev libheif-dev libpng-dev libturbojpeg0-dev

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ matrix.flutter-channel }}
          flutter-version: ${{ matrix.flutter-channel == 'stable' && '3.44.8' || '' }}
          cache: ${{ matrix.flutter-channel == 'stable' }}
          pub-cache: false
          cache-key: 'flutter-:os:-:channel:-:version:-:arch:-:hash:'

      - name: Install dependencies
        run: flutter pub get ${{ matrix.flutter-channel == 'stable' && '--enforce-lockfile' || '' }}

      - name: Prefetch native artifacts
        uses: ./.github/actions/prefetch-native-artifacts
        with:
          target: linux

      - name: Prefetch mimalloc tarball (debug)
        uses: ./.github/actions/prefetch-mimalloc
        with:
          build-mode: debug

      - name: Build Linux (debug)
        run: flutter build linux --debug

      - name: Prefetch mimalloc tarball (release)
        if: matrix.flutter-channel == 'stable'
        uses: ./.github/actions/prefetch-mimalloc
        with:
          build-mode: release

      - name: Build Linux (release)
        if: matrix.flutter-channel == 'stable'
        run: flutter build linux --release

      - name: Report flutter_assets size
        run: |
          echo "=== flutter_assets total ==="
          du -sh build/linux/*/release/bundle/data/flutter_assets/ 2>/dev/null || du -sh build/linux/*/debug/bundle/data/flutter_assets/ 2>/dev/null || true
          echo "=== .tflite models ==="
          find build/linux -name '*.tflite' -exec ls -lh {} \; 2>/dev/null || true
          echo "=== sample images ==="
          find build/linux -path '*/assets/samples/*' -exec ls -lh {} \; 2>/dev/null || true

  build-windows:
    name: Build Windows (${{ matrix.flutter-channel }})
    runs-on: windows-latest
    timeout-minutes: 75
    continue-on-error: ${{ matrix.flutter-channel == 'beta' }}
    strategy:
      fail-fast: false
      matrix:
        flutter-channel: [stable, beta]
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ matrix.flutter-channel }}
          flutter-version: ${{ matrix.flutter-channel == 'stable' && '3.44.8' || '' }}
          cache: ${{ matrix.flutter-channel == 'stable' }}
          pub-cache: false
          cache-key: 'flutter-:os:-:channel:-:version:-:arch:-:hash:'

      - name: Install dependencies
        run: flutter pub get ${{ matrix.flutter-channel == 'stable' && '--enforce-lockfile' || '' }}

      - name: Prefetch native artifacts
        uses: ./.github/actions/prefetch-native-artifacts
        with:
          target: windows

      - name: Build Windows (debug)
        run: flutter build windows --debug

      - name: Build Windows (release)
        if: matrix.flutter-channel == 'stable'
        run: flutter build windows --release

      - name: Report flutter_assets size
        shell: bash
        run: |
          echo "=== flutter_assets total ==="
          du -sh build/windows/*/runner/Debug/data/flutter_assets/ 2>/dev/null || du -sh build/windows/*/runner/Release/data/flutter_assets/ 2>/dev/null || true
          echo "=== .tflite models ==="
          find build/windows -name '*.tflite' -exec ls -lh {} \; 2>/dev/null || true
          echo "=== sample images ==="
          find build/windows -path '*/assets/samples/*' -exec ls -lh {} \; 2>/dev/null || true
