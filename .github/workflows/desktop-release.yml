name: Desktop Release

# Dispatch only. A tag-push trigger cannot work with how releases are actually
# cut: the flow builds a draft, attaches the hand-built macOS and Android
# assets, and then publishes, and publishing is what creates the tag. So the tag
# always arrives after the release exists, and the prepare job's own
# "release already exists" guard fails the run, leaving a red X on the released
# commit. Releasing by tag push was never viable anyway, since that path has no
# draft input and would publish immediately without the two assets CI cannot
# build.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to build from'
        required: true
        default: main
      tag:
        description: 'Release tag (e.g. agelapse-v2.7.0)'
        required: true
      prerelease:
        description: 'Mark as pre-release'
        type: boolean
        default: false
      draft:
        description: 'Draft release (private, only you can see it)'
        type: boolean
        default: true

jobs:
  prepare:
    name: Prepare Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      build_number: ${{ steps.version.outputs.build_number }}
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      ref: ${{ steps.version.outputs.ref }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.ref || github.sha }}
          fetch-depth: 0

      - name: Resolve version from tag and pubspec
        id: version
        run: |
          # Determine the tag and ref
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
            PRERELEASE="${{ github.event.inputs.prerelease }}"
            REF="${{ github.event.inputs.ref }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
            PRERELEASE="false"
            REF="${GITHUB_SHA}"
          fi

          # Resolve ref to immutable SHA so all jobs build the same commit
          REF=$(git rev-parse HEAD)

          # Extract version from tag (agelapse-v2.5.0 -> 2.5.0)
          TAG_VERSION="${TAG#agelapse-v}"

          # Extract version from pubspec.yaml (handles both "2.5.0+37" and "2.5.0")
          PUBSPEC_FULL=$(grep '^version:' pubspec.yaml | sed 's/version: *//')
          PUBSPEC_VERSION=$(echo "$PUBSPEC_FULL" | sed 's/+.*//')
          if echo "$PUBSPEC_FULL" | grep -q '+'; then
            BUILD_NUMBER=$(echo "$PUBSPEC_FULL" | sed 's/.*+//')
          else
            BUILD_NUMBER="1"
          fi

          echo "Tag version:     $TAG_VERSION"
          echo "Pubspec version: $PUBSPEC_VERSION"
          echo "Build number:    $BUILD_NUMBER"

          if [ "$TAG_VERSION" != "$PUBSPEC_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match pubspec.yaml ($PUBSPEC_VERSION)"
            exit 1
          fi

          echo "version=$TAG_VERSION" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

      - name: Check release does not already exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if gh release view "$TAG" &>/dev/null; then
            echo "::error::Release '$TAG' already exists. Delete it first or use a new version."
            exit 1
          fi
          echo "No existing release for '$TAG'; proceeding."

  build-windows:
    name: Build Windows Installer
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          persist-credentials: false

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build Windows release
        run: flutter build windows --release --build-name=${{ needs.prepare.outputs.version }} --build-number=${{ needs.prepare.outputs.build_number }}

      - name: Build Inno Setup installer
        run: |
          iscc /DMyAppVersion="${{ needs.prepare.outputs.version }}" packaging\installer.iss

      - name: Rename installer
        shell: bash
        run: |
          mv "dist/installer/AgeLapse_Setup_${{ needs.prepare.outputs.version }}_x64.exe" \
             "dist/installer/agelapse-windows-${{ needs.prepare.outputs.version }}-x64.exe"

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/installer/agelapse-windows-${{ needs.prepare.outputs.version }}-x64.exe
          if-no-files-found: error

  build-linux:
    name: Build Linux Packages
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          persist-credentials: false

      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Install Linux dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libmpv-dev libheif-dev libpng-dev libturbojpeg0-dev \
            flatpak flatpak-builder

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Prefetch mimalloc tarball
        uses: ./.github/actions/prefetch-mimalloc
        with:
          build-mode: release

      - name: Build Linux release
        run: flutter build linux --release --build-name=${{ needs.prepare.outputs.version }} --build-number=${{ needs.prepare.outputs.build_number }}

      - name: Install patchelf
        run: sudo apt-get install -y patchelf

      # --- .deb package ---
      - name: Install Fastforge
        run: dart pub global activate fastforge 0.6.6

      - name: Patch deb version to match release
        run: |
          sed -i "s/^version: .*/version: \"${{ needs.prepare.outputs.version }}\"/" linux/packaging/deb/make_config.yaml

      - name: Build .deb package
        run: |
          export PATH="$PATH:$HOME/.pub-cache/bin"
          fastforge package --platform linux --targets deb

      # Bundled libraries carry either no RUNPATH at all or one baked to the CI
      # checkout path, and RUNPATH is not inherited by transitive dependencies,
      # so libheif cannot locate its sibling libde265 on a machine without those
      # libraries installed system-wide even though both ship in the bundle.
      #
      # This must run *after* the .deb build: fastforge re-runs
      # `flutter build linux` itself, which regenerates the bundle and discards
      # any earlier patching. It normalizes the staged bundle, which the tarball
      # and Flatpak below are both created from, and rewrites the .deb payload
      # in place.
      - name: Normalize bundled library RPATHs
        run: |
          normalize() {
            LIB_DIR="$1"

            while IFS= read -r -d '' LIBRARY; do
              patchelf --set-rpath '$ORIGIN' "$LIBRARY" || {
                echo "::error::patchelf failed on $LIBRARY"
                exit 1
              }
            done < <(find "$LIB_DIR" -type f -name '*.so*' -print0)

            LEAKED=$(find "$LIB_DIR" -type f -name '*.so*' \
              -exec patchelf --print-rpath {} \; | grep -v '^\$ORIGIN$' || true)
            if [ -n "$LEAKED" ]; then
              echo "::error::Libraries in $LIB_DIR still reference paths outside the bundle:"
              echo "$LEAKED"
              exit 1
            fi
            echo "Normalized $LIB_DIR"
          }

          normalize build/linux/x64/release/bundle/lib

          # Prove $ORIGIN actually expands, rather than trusting that setting it
          # was enough. libde265 is installed system-wide on this runner, so if
          # RUNPATH were not working this would silently resolve to /lib and the
          # defect would reach the smoke jobs again.
          RESOLVED=$(ldd build/linux/x64/release/bundle/lib/libheif.so.1 |
            awk '/libde265/ {print $3}')
          case "$RESOLVED" in
            */bundle/lib/*)
              echo "libheif resolves libde265 from the bundle: $RESOLVED"
              ;;
            *)
              echo "::error::libheif resolved libde265 from '$RESOLVED' rather than the bundle."
              exit 1
              ;;
          esac

          DEB_FILE=$(find dist -name '*.deb' -type f | head -1)
          sudo rm -rf deb-root
          dpkg-deb -R "$DEB_FILE" deb-root
          DEB_LIB=$(dirname "$(find deb-root -name 'libflutter_linux_gtk.so' -print -quit)")
          normalize "$DEB_LIB"
          # dpkg-deb records the ownership it finds on disk, and the unpacked
          # tree belongs to the runner user. Restore root:root so the rebuilt
          # package installs with the same ownership fastforge produced.
          sudo chown -R root:root deb-root
          sudo dpkg-deb -b deb-root "$DEB_FILE"
          sudo chown "$(id -u):$(id -g)" "$DEB_FILE"
          sudo rm -rf deb-root

          dpkg-deb -c "$DEB_FILE" | head -5

      - name: Rename .deb
        run: |
          DEB_FILE=$(find dist -name '*.deb' -type f | head -1)
          mv "$DEB_FILE" "dist/agelapse-linux-${{ needs.prepare.outputs.version }}-x64.deb"

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: dist/agelapse-linux-${{ needs.prepare.outputs.version }}-x64.deb
          if-no-files-found: error

      # --- Linux bundle tarball ---
      - name: Create bundle tarball
        run: |
          cd build/linux/x64/release
          tar -czvf "$GITHUB_WORKSPACE/dist/agelapse-linux-${{ needs.prepare.outputs.version }}-x64-bundle.tar.gz" bundle/

      - name: Upload bundle tarball
        uses: actions/upload-artifact@v4
        with:
          name: linux-bundle
          path: dist/agelapse-linux-${{ needs.prepare.outputs.version }}-x64-bundle.tar.gz
          if-no-files-found: error

      # --- Flatpak ---
      - name: Setup Flatpak
        run: |
          sudo flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y flathub org.freedesktop.Platform//24.08 org.freedesktop.Sdk//24.08
          sudo flatpak install -y flathub org.freedesktop.Platform.ffmpeg-full//24.08

      - name: Cache Flatpak builder
        uses: actions/cache@v5
        with:
          path: flatpak/.flatpak-builder
          key: flatpak-builder-${{ hashFiles('flatpak/com.hugocornellier.agelapse.yaml') }}
          restore-keys: flatpak-builder-

      - name: Build Flatpak
        run: |
          # Copy Flutter bundle into flatpak directory
          rm -rf flatpak/bundle
          cp -r build/linux/x64/release/bundle flatpak/bundle

          # Build the Flatpak
          cd flatpak
          flatpak-builder --repo=repo --force-clean --ccache build-dir com.hugocornellier.agelapse.yaml

          # Create distributable .flatpak file
          flatpak build-bundle repo \
            "$GITHUB_WORKSPACE/dist/agelapse-linux-${{ needs.prepare.outputs.version }}-x64.flatpak" \
            com.hugocornellier.agelapse

      - name: Upload .flatpak
        uses: actions/upload-artifact@v4
        with:
          name: linux-flatpak
          path: dist/agelapse-linux-${{ needs.prepare.outputs.version }}-x64.flatpak
          if-no-files-found: error

  smoke-windows-installer:
    name: Smoke Windows Installed Package
    needs: [prepare, build-windows]
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: package

      - name: Install, launch, and uninstall packaged app
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $installer = Get-ChildItem package -Filter "*.exe" -File |
            Select-Object -First 1
          if (-not $installer) {
            throw "The downloaded artifact does not contain an installer."
          }

          $installDir = Join-Path $env:ProgramFiles "AgeLapse"
          if (Test-Path $installDir) {
            throw "Expected a clean runner, but $installDir already exists."
          }

          $installLog = Join-Path $env:RUNNER_TEMP "agelapse-install.log"
          $installArgs = @(
            "/VERYSILENT",
            "/SUPPRESSMSGBOXES",
            "/NORESTART",
            "/SP-",
            "/LOG=$installLog"
          )
          $installProcess = Start-Process `
            -FilePath $installer.FullName `
            -ArgumentList $installArgs `
            -Wait `
            -PassThru
          if ($installProcess.ExitCode -ne 0) {
            if (Test-Path $installLog) {
              Get-Content $installLog
            }
            throw "Installer exited with code $($installProcess.ExitCode)."
          }

          $appExe = Join-Path $installDir "agelapse.exe"
          $uninstaller = Join-Path $installDir "unins000.exe"
          $requiredPaths = @(
            $appExe,
            $uninstaller,
            (Join-Path $installDir "flutter_windows.dll"),
            (Join-Path $installDir "data\flutter_assets")
          )
          foreach ($path in $requiredPaths) {
            if (-not (Test-Path $path)) {
              throw "Installed package is missing required path: $path"
            }
          }

          $stdoutLog = Join-Path $env:RUNNER_TEMP "agelapse-stdout.log"
          $stderrLog = Join-Path $env:RUNNER_TEMP "agelapse-stderr.log"
          $appProcess = Start-Process `
            -FilePath $appExe `
            -WorkingDirectory $installDir `
            -RedirectStandardOutput $stdoutLog `
            -RedirectStandardError $stderrLog `
            -PassThru

          Start-Sleep -Seconds 20
          $appProcess.Refresh()
          if ($appProcess.HasExited) {
            if (Test-Path $stdoutLog) {
              Get-Content $stdoutLog
            }
            if (Test-Path $stderrLog) {
              Get-Content $stderrLog
            }
            throw "Installed app exited during the 20-second startup smoke window (code $($appProcess.ExitCode))."
          }

          Stop-Process -Id $appProcess.Id -Force
          $appProcess.WaitForExit()
          Write-Host "Installed app remained running for the complete startup smoke window."

          $uninstallLog = Join-Path $env:RUNNER_TEMP "agelapse-uninstall.log"
          $uninstallArgs = @(
            "/VERYSILENT",
            "/SUPPRESSMSGBOXES",
            "/NORESTART",
            "/LOG=$uninstallLog"
          )
          $uninstallProcess = Start-Process `
            -FilePath $uninstaller `
            -ArgumentList $uninstallArgs `
            -Wait `
            -PassThru
          if ($uninstallProcess.ExitCode -ne 0) {
            if (Test-Path $uninstallLog) {
              Get-Content $uninstallLog
            }
            throw "Uninstaller exited with code $($uninstallProcess.ExitCode)."
          }

          Start-Sleep -Seconds 2
          if (Test-Path $appExe) {
            throw "Uninstall completed but the installed executable still exists."
          }
          Write-Host "Installer, packaged startup, and uninstaller smoke checks passed."

  smoke-linux-packages:
    name: Smoke Linux ${{ matrix.label }}
    needs: [prepare, build-linux]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: deb
            label: Debian Package
            artifact: linux-deb
          - kind: bundle
            label: Bundle
            artifact: linux-bundle
          - kind: flatpak
            label: Flatpak
            artifact: linux-flatpak
    steps:
      - name: Download packaged artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: package

      - name: Install headless launch support
        run: |
          sudo apt-get update -y
          sudo apt-get install -y dbus-x11 xvfb

      - name: Install, launch, and remove Debian package
        if: matrix.kind == 'deb'
        run: |
          DEB_FILE=$(find package -maxdepth 1 -type f -name '*.deb' -print -quit)
          if [ -z "$DEB_FILE" ]; then
            echo "::error::The downloaded artifact does not contain a .deb package."
            exit 1
          fi

          DEB_FILE=$(realpath "$DEB_FILE")
          dpkg-deb --info "$DEB_FILE"
          sudo apt-get install -y "$DEB_FILE"

          if [ "$(dpkg-query -W -f='${Status}' agelapse)" != "install ok installed" ]; then
            echo "::error::dpkg does not report agelapse as installed."
            exit 1
          fi

          dpkg-query -L agelapse | tee "$RUNNER_TEMP/agelapse-deb-files.log"
          test -x /opt/agelapse/agelapse
          test -x /usr/bin/agelapse
          test -d /opt/agelapse/data/flutter_assets
          if ! grep -Eq '/usr/share/applications/.+\.desktop$' "$RUNNER_TEMP/agelapse-deb-files.log"; then
            echo "::error::The Debian package did not install a desktop entry."
            exit 1
          fi

          : > "$RUNNER_TEMP/agelapse-deb-ldd.log"
          while IFS= read -r -d '' LIBRARY; do
            if file "$LIBRARY" | grep -q 'ELF'; then
              echo "==> $LIBRARY" | tee -a "$RUNNER_TEMP/agelapse-deb-ldd.log"
              # Deliberately no LD_LIBRARY_PATH: the installed package has to
              # resolve its own libraries the way it will on a user's machine.
              ldd "$LIBRARY" |
                tee -a "$RUNNER_TEMP/agelapse-deb-ldd.log"
            fi
          done < <(find /opt/agelapse -type f \
            \( -name agelapse -o -name '*.so' -o -name '*.so.*' \) -print0)
          # libjvm.so is expected to be absent. It is needed only by
          # libdartjni.so, which package:jni dlopens on demand for Android;
          # nothing in the bundle links it, so it is never loaded on Linux.
          # Its RUNPATH used to point at the CI runner's JDK, which resolved
          # here and nowhere else.
          UNRESOLVED=$(grep 'not found' "$RUNNER_TEMP/agelapse-deb-ldd.log" |
            grep -v 'libjvm\.so' || true)
          if [ -n "$UNRESOLVED" ]; then
            echo "::error::The installed Debian package has unresolved shared libraries."
            echo "$UNRESOLVED"
            exit 1
          fi

          set +e
          timeout --signal=TERM --kill-after=10s 20s \
            dbus-run-session -- xvfb-run -a /usr/bin/agelapse \
            >"$RUNNER_TEMP/agelapse-deb-startup.log" 2>&1
          STARTUP_STATUS=$?
          set -e
          cat "$RUNNER_TEMP/agelapse-deb-startup.log"
          if [ "$STARTUP_STATUS" -ne 124 ]; then
            echo "::error::Installed Debian app exited before the 20-second startup window completed (code $STARTUP_STATUS)."
            exit 1
          fi

          sudo apt-get purge -y agelapse
          if dpkg-query -W agelapse >/dev/null 2>&1; then
            echo "::error::The Debian package is still registered after purge."
            exit 1
          fi
          test ! -e /usr/bin/agelapse
          test ! -e /opt/agelapse/agelapse
          echo "Debian install, dependency, packaged startup, and removal checks passed."

      - name: Extract, inspect, and launch Linux bundle
        if: matrix.kind == 'bundle'
        run: |
          # Runtime packages only, mirroring what the .deb declares, so the
          # tarball is exercised the way a user's machine will run it. Installing
          # -dev packages here dragged in libheif, libde265 and the GL stack
          # transitively, which is why this job reported success for a bundle
          # whose libraries could not resolve each other, and again for one that
          # aborted on a missing libGLESv2. Keep in sync with
          # linux/packaging/deb/make_config.yaml.
          sudo apt-get install -y \
            ffmpeg \
            libgstreamer1.0-0 libgstreamer-plugins-base1.0-0 \
            libmpv2 libgles2 libegl1
          # GTK and turbojpeg were renamed by the 64-bit time_t transition, and
          # the .deb declares both spellings as alternatives. Accept either.
          sudo apt-get install -y libgtk-3-0t64 || sudo apt-get install -y libgtk-3-0
          sudo apt-get install -y libturbojpeg || sudo apt-get install -y libturbojpeg0

          BUNDLE_FILE=$(find package -maxdepth 1 -type f -name '*.tar.gz' -print -quit)
          if [ -z "$BUNDLE_FILE" ]; then
            echo "::error::The downloaded artifact does not contain a bundle tarball."
            exit 1
          fi

          mkdir unpacked
          tar -xzf "$BUNDLE_FILE" -C unpacked
          test -x unpacked/bundle/agelapse
          test -d unpacked/bundle/data/flutter_assets

          : > "$RUNNER_TEMP/agelapse-bundle-ldd.log"
          while IFS= read -r -d '' LIBRARY; do
            if file "$LIBRARY" | grep -q 'ELF'; then
              echo "==> $LIBRARY" | tee -a "$RUNNER_TEMP/agelapse-bundle-ldd.log"
              # Deliberately no LD_LIBRARY_PATH: the extracted bundle has to
              # resolve its own libraries the way it will on a user's machine.
              ldd "$LIBRARY" |
                tee -a "$RUNNER_TEMP/agelapse-bundle-ldd.log"
            fi
          done < <(find unpacked/bundle -type f \
            \( -name agelapse -o -name '*.so' -o -name '*.so.*' \) -print0)
          # See the Debian job for why an absent libjvm.so is expected.
          UNRESOLVED=$(grep 'not found' "$RUNNER_TEMP/agelapse-bundle-ldd.log" |
            grep -v 'libjvm\.so' || true)
          if [ -n "$UNRESOLVED" ]; then
            echo "::error::The extracted Linux bundle has unresolved shared libraries."
            echo "$UNRESOLVED"
            exit 1
          fi

          set +e
          (
            cd unpacked/bundle
            timeout --signal=TERM --kill-after=10s 20s \
              dbus-run-session -- xvfb-run -a ./agelapse
          ) >"$RUNNER_TEMP/agelapse-bundle-startup.log" 2>&1
          STARTUP_STATUS=$?
          set -e
          cat "$RUNNER_TEMP/agelapse-bundle-startup.log"
          if [ "$STARTUP_STATUS" -ne 124 ]; then
            echo "::error::Bundled Linux app exited before the 20-second startup window completed (code $STARTUP_STATUS)."
            exit 1
          fi
          echo "Bundle extraction, dependency, and packaged startup checks passed."

      - name: Install, launch, and remove Flatpak
        if: matrix.kind == 'flatpak'
        run: |
          sudo apt-get install -y flatpak

          FLATPAK_FILE=$(find package -maxdepth 1 -type f -name '*.flatpak' -print -quit)
          if [ -z "$FLATPAK_FILE" ]; then
            echo "::error::The downloaded artifact does not contain a Flatpak bundle."
            exit 1
          fi

          FLATPAK_FILE=$(realpath "$FLATPAK_FILE")
          flatpak remote-add --user --if-not-exists \
            flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub \
            org.freedesktop.Platform//24.08 \
            org.freedesktop.Platform.ffmpeg-full//24.08
          flatpak install --user -y --noninteractive "$FLATPAK_FILE"

          flatpak info --user com.hugocornellier.agelapse
          flatpak run --command=sh com.hugocornellier.agelapse -euxc \
            'test -x /app/agelapse
             test -x /app/bin/agelapse
             test -d /app/data/flutter_assets
             test -d /app/lib/ffmpeg
             test -f /app/share/applications/com.hugocornellier.agelapse.desktop
             command -v ffmpeg
             ffmpeg -hide_banner -version'

          set +e
          timeout --signal=TERM --kill-after=10s 20s \
            dbus-run-session -- xvfb-run -a \
            flatpak run com.hugocornellier.agelapse \
            >"$RUNNER_TEMP/agelapse-flatpak-startup.log" 2>&1
          STARTUP_STATUS=$?
          set -e
          cat "$RUNNER_TEMP/agelapse-flatpak-startup.log"
          if [ "$STARTUP_STATUS" -ne 124 ]; then
            echo "::error::Installed Flatpak exited before the 20-second startup window completed (code $STARTUP_STATUS)."
            exit 1
          fi

          flatpak uninstall --user -y --noninteractive \
            com.hugocornellier.agelapse
          if flatpak info --user com.hugocornellier.agelapse >/dev/null 2>&1; then
            echo "::error::The Flatpak is still installed after removal."
            exit 1
          fi
          echo "Flatpak install, packaged startup, and removal checks passed."

  publish-release:
    name: Publish GitHub Release
    needs:
      - prepare
      - build-windows
      - build-linux
      - smoke-windows-installer
      - smoke-linux-packages
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List release assets
        run: ls -lh release-assets/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PRERELEASE_FLAG=""
          if [ "${{ needs.prepare.outputs.prerelease }}" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          DRAFT_FLAG=""
          if [ "${{ github.event.inputs.draft }}" = "true" ]; then
            DRAFT_FLAG="--draft"
          fi

          # Any release posted publicly (i.e. not a draft) is always marked as a
          # pre-release, regardless of the prerelease input. Tag-push releases
          # have no draft input, so they are public and forced to pre-release too.
          if [ -z "$DRAFT_FLAG" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          # For manual dispatch, create tag on the correct ref
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            gh release create "${{ needs.prepare.outputs.tag }}" \
              --title "AgeLapse v${{ needs.prepare.outputs.version }}" \
              --generate-notes \
              --target "${{ needs.prepare.outputs.ref }}" \
              $PRERELEASE_FLAG \
              $DRAFT_FLAG \
              release-assets/*
          else
            gh release create "${{ needs.prepare.outputs.tag }}" \
              --title "AgeLapse v${{ needs.prepare.outputs.version }}" \
              --generate-notes \
              --verify-tag \
              $PRERELEASE_FLAG \
              $DRAFT_FLAG \
              release-assets/*
          fi
